name: AACP Conformance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r conformance/harness/requirements.txt

      - name: Run AACP Core conformance
        run: python -m pytest -q conformance/harness
