# Packaging for the AACP repository distribution.
#
# Versioning policy (do not invent a separate Publication API version yet):
# - AACP distribution = 1.1.0-rc.3  (pep440: 1.1.0rc3)
# - AACP Core         = 1.0
# - Publication Layer = no separate public version; ships under the distribution
#
# Keep [project].version aligned with the current distribution until a dedicated
# Publication package version is explicitly decided.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aacp"
version = "1.1.0rc3"
description = "Agent-to-Agent Collaboration Protocol — Publication Layer skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance/tests"]
pythonpath = ["src"]
